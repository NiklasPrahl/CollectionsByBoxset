name: Build, test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/Jellyfin.Plugin.CollectionsByBoxset.Tests/Jellyfin.Plugin.CollectionsByBoxset.Tests.csproj -c Release

      - name: Build plugin
        run: dotnet build src/Jellyfin.Plugin.CollectionsByBoxset/Jellyfin.Plugin.CollectionsByBoxset.csproj -c Release -o build

      - name: Package
        run: |
          mkdir -p out
          (cd build && zip -9 ../out/Jellyfin.Plugin.CollectionsByBoxset.zip Jellyfin.Plugin.CollectionsByBoxset.dll)
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: out/Jellyfin.Plugin.CollectionsByBoxset.zip

      - name: Create manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}.0"
          MD5=$(md5sum out/Jellyfin.Plugin.CollectionsByBoxset.zip | awk '{print tolower($1)}')
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > out/manifest.json <<JSON
          [
            {
              "guid": "92e7bf59-1970-45c9-8df1-714f7eb80f55",
              "name": "Collections by Boxset",
              "overview": "Erstellt Sammlungen aus Ordnern mit [boxset] im Namen.",
              "description": "Ordner, deren Name auf [boxset] endet, werden zu Jellyfin-Sammlungen.",
              "owner": "NiklasPrahl",
              "category": "Library",
              "versions": [
                {
                  "version": "${VERSION}",
                  "changelog": "Release ${TAG}",
                  "targetAbi": "12.2.0.0",
                  "sourceUrl": "https://github.com/${{ github.repository }}/releases/download/${TAG}/Jellyfin.Plugin.CollectionsByBoxset.zip",
                  "checksum": "${MD5}",
                  "timestamp": "${TS}"
                }
              ]
            }
          ]
          JSON
          sed -i 's/^          //' out/manifest.json
          cat out/manifest.json

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Jellyfin.Plugin.CollectionsByBoxset.zip
            out/manifest.json
